<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מבחני סייבר</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Suez+One&display=swap">
<style>
/* Layout: answer-sheet metaphor — question on the main column, a "דף קידוד" bubble grid beside it; tabs on top. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f8f9fc; --ink:#141a26; --muted:#5b6474; --faint:#8a93a3;
  --line:#dde2ea; --accent:#2b4fd8; --accent-ink:#ffffff; --accent-soft:#e7ecfd;
  --good:#1e8a4c; --good-soft:#e3f4ea; --bad:#c4372c; --bad-soft:#fbe8e6; --warn:#a96a12;
  --bar:#2a78d6; --code:#eef1f6;
  --f-body:"IBM Plex Sans Hebrew","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --f-display:"Suez One","IBM Plex Sans Hebrew",Georgia,serif;
  --f-mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#161b24; --surface-2:#1b212c; --ink:#e7ebf2; --muted:#9ba5b6; --faint:#6f7a8c;
  --line:#2a313d; --accent:#7f9bff; --accent-ink:#0e1218; --accent-soft:#1e274a;
  --good:#47c17e; --good-soft:#15301f; --bad:#ff7466; --bad-soft:#3a1a17; --warn:#e2a548;
  --bar:#3987e5; --code:#1f2632; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161b24; --surface-2:#1b212c; --ink:#e7ebf2; --muted:#9ba5b6; --faint:#6f7a8c;
  --line:#2a313d; --accent:#7f9bff; --accent-ink:#0e1218; --accent-soft:#1e274a;
  --good:#47c17e; --good-soft:#15301f; --bad:#ff7466; --bad-soft:#3a1a17; --warn:#e2a548;
  --bar:#3987e5; --code:#1f2632; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.2px;white-space:nowrap}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-inline-start:8px;font-weight:500}
nav.tabs{display:flex;gap:4px;margin-inline-start:auto;align-items:center}
nav.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;color:var(--muted);font-weight:600;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs a.tab-link{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-size:14px;transition:background .15s,color .15s}
nav.tabs a.tab-link:hover{background:var(--surface-2);color:var(--ink)}
main{padding-block:24px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:20px} h3{font-size:16px}
.sub{color:var(--muted);margin:4px 0 0}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:18px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip .n{color:var(--faint);font-family:var(--f-mono);font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
label.field{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=number],input[type=text],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=number]{width:90px}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);cursor:pointer;text-align:start;display:grid;gap:4px}
.mode b{font-size:15px}
.mode span{font-size:13px;color:var(--muted);line-height:1.5}
.mode[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode[aria-checked="true"] b{color:var(--accent)}
.group{display:grid;gap:8px}
.group .chips{display:flex;flex-wrap:wrap;gap:6px}
.summary{position:sticky;top:76px;display:grid;gap:14px}
.big{font-family:var(--f-display);font-size:44px;line-height:1}
.summary .big small{font-family:var(--f-body);font-size:14px;color:var(--muted);margin-inline-start:6px}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:4;background:var(--bg);padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.timer{font-family:var(--f-mono);font-size:18px;font-weight:500;padding:3px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.progress{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qnum{font-weight:700;font-size:17px}
.stem{font-size:16px;line-height:1.75}
.stem .ln,.opt .ln{margin:1px 0}
.ln[dir=ltr]{text-align:right}
pre{direction:ltr;text-align:left;background:var(--code);border-radius:8px;padding:10px 12px;font:13px/1.55 var(--f-mono);overflow-x:auto;white-space:pre;margin:8px 0}
code{font:13.5px var(--f-mono);background:var(--code);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:8px 0}
.tbl table{border-collapse:collapse;font-size:13.5px}
.tbl td,.tbl th{border:1px solid var(--line);padding:4px 9px;text-align:center}
.tbl th{background:var(--surface-2)}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;line-height:1.6}
.opt:hover{border-color:var(--faint)}
.opt .t{flex:1;min-width:0}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.mark{font-size:12px;font-weight:700;margin-inline-start:auto;white-space:nowrap}
.mark.okm{color:var(--good)} .mark.badm{color:var(--bad)}
.qnav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.feedback{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:14px}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.meta-line{color:var(--muted);font-size:12.5px;margin-top:10px}

/* answer sheet */
.sheet{position:sticky;top:130px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:calc(100vh - 150px);overflow:auto}
.sheet h3{font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between}
.srow{display:grid;grid-template-columns:30px repeat(4,22px) 14px;gap:6px;align-items:center;padding:3px 4px;border-radius:6px}
.srow.cur{background:var(--accent-soft)}
.srow .sn{font-family:var(--f-mono);font-size:12px;color:var(--muted);cursor:pointer;background:none;border:0;padding:0;text-align:start}
.sb{width:22px;height:22px;border-radius:50%;border:1.3px solid var(--faint);background:none;cursor:pointer;font-size:10px;color:var(--faint);padding:0;display:grid;place-items:center}
.sb.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.sb.ok{background:var(--good);border-color:var(--good);color:#fff}
.sb.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.flag{font-size:11px;color:var(--warn)}
.legend{font-size:12px;color:var(--muted);margin-top:8px;display:grid;gap:2px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .panel{max-width:420px;width:100%;display:grid;gap:14px}

/* results */
.result-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.score{font-family:var(--f-display);font-size:72px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:var(--f-display);font-size:28px;line-height:1.1}
.kpi .k{font-size:13px;color:var(--muted)}
.review-item{border-top:1px solid var(--line);padding-block:16px}
.review-item .opt{cursor:default}

/* charts */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:14px;position:relative}
.bar .fill{position:absolute;inset-block:0;right:0;background:var(--bar);border-radius:4px 0 0 4px;min-width:2px}
.bar .val{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:left}
.heat{border-collapse:separate;border-spacing:2px;font-size:12.5px;min-width:520px;width:100%}
.heat th{font-weight:600;color:var(--muted);padding:4px 6px;text-align:center}
.heat th.rowh{text-align:start;color:var(--ink);font-weight:500;white-space:nowrap}
.heat td{width:72px;height:32px;text-align:center;border-radius:4px;font-family:var(--f-mono)}
.tip{position:fixed;z-index:30;background:var(--ink);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:6px;pointer-events:none;max-width:260px;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.list{display:grid;gap:10px;align-content:start}
.li{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface);font-size:14px;display:grid;gap:4px}
.li .m{font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
.terms{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.terms span{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 5px}

/* bank */
.bankq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bankq .opt{padding:6px 10px;border-width:1px}
.bankq .opts{gap:5px;margin-top:10px}

/* print view */
.printdoc .ver{break-before:page}
.printdoc .ver:first-child{break-before:auto}
.pq{break-inside:avoid;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:var(--surface)}
.pq ol{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.pq li{display:flex;gap:10px}
.keytbl{border-collapse:collapse;font-size:13px;width:100%}
.keytbl td,.keytbl th{border:1px solid var(--line);padding:4px 8px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

@media (max-width:860px){
  .setup,.exam{grid-template-columns:minmax(0,1fr)}
  .summary,.sheet{position:static;max-height:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .modes{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:minmax(0,1fr) 54px}
  .bar .lbl{grid-column:1/-1}
  .result-head{grid-template-columns:minmax(0,1fr)}
  nav.tabs{margin-inline-start:0;width:100%}
  .exambar{position:static}
  .qcard{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;color:#000}
  body::before,.top,.noprint{display:none!important}
  main{padding:0}
  .pq{border-color:#999;background:#fff}
  @page{margin:14mm}
}
</style>

ם בין שני שרתים","ב TLS, שרת האינטרנט מייצר את התעודה עבור חיבור ה TLS"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":10},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.319,"exam_count":1,"in_sample_exam":false,"variant_group":"V03"},{"id":"Q011","year":"2022","stem":"חברה חדשה מציעה חומת אש הפועלת בטכנולוגיה הבאה:\nחומת האש בודקת את כל כתובות ה source IP של החבילות שרוצות לצאת מתוך הרשת החוצה ובמידה והיא מוצאת כתובת IP שאחראית ליותר מ X אחוזים מהתעבורה בשעה האחרונה, היא אוטו' מוסיפה חוק שמסנן את כל החבילות מהכתובת הזאת למשך 24 שעות. איזו מהטענות הבאות נכונה?","options":["הטכנולוגיה עלולה לשבש את התעבורה התקינה, מפני שהיא עלולה לחסום מחשבים לגיטימיים שמייצרים הרבה תעבורה לגיטימית","מחשב זדוני שנמצא בתוך הרשת אינו יכול להשתמש ב spoofed source ip - ולכן אינו יכול לגרום לחסימה של כתובות ip לגיטימיות","הטכנולוגיה הנ\"ל נותנת מענה כנגד התקפות המנצלות חולשה באופן שבו מומשה חומת האש","הטכנולוגיה הנ\"ל מונעת כל התקפה המנצלות חולשה במחשב שנמצא בתוך הרשת, למשל מחשב הפגיע ל Ping of death"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":11},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":11}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.25,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q012","year":"2022","stem":"לחבילות בשכבת הרשת יש שדה ID-IP המשמש לפרגמנטציה. חבילות שונות (שאינן תוצאה של פרגמנטציה) נדרשות להיות עם ID-IP שונה כל אחת בתקשורת בין שני מחשבים. ישנן מ\"ה אשר משתמשות במונה גלובלי אשר גדל ב1 על כל חבילה שנשלחת והערך של ה ID-IP הוא לפי מונה זה.\nנתון מחשב A בשליטת תוקף ונתון מחשב V אחר אשר מ\"ה שלו מממשת מונה גלובלי עבור ID-IP כפי שמוזכר לעיל. כמו כן, במידה ומחשב V מקבל בקשת פינג (ping) הוא משיב עליה בתשובת פינג (ping). האם ניתן לגלות האם מחשב V תיקשר עם מחשבים אחרים במהלך פרק זמן מסויים?","options":["כן. שולחים ping ל V מ A בתחילת פרק הזמן ושולחים ping נוסף ל V מ A בסוף פרק הזמן. בודקים את ההפרש בין ה IP-ID שהתקבל בכל אחד מהתשובות, ומסיקים (גדול מ1 ⇐ הייתה תקשורת עם אחרים בין לבין)","כן. שולחים ping ל V מ A בתחילת פרק הזמן ושולחים ping נוסף ל V מ A בסוף פרק הזמן. אם קיבלנו בפעם השניה את אותו ה IP-ID שהתקבל בראשונה, סימן שלא הייתה תקשורת עם אחרים בין לבין","לא. כדי לדעת דבר שכזה, חובה להחזיק חיבור TCP רצוף בין A ל V, ולכן מנגנון ה syn cookies ישבש את המונה","לא. מנגנון ה same-origin-policy יחסום זאת"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":12},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":12}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.167,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q013","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["בעיה גדולה ב One Time Pad היא העברת המפתחות","בעיה גדולה ב Public Key Cryptography היא העברת המפתחות","בעיה גדולה ב RSA היא העברת המפתחות","בעיה גדולה ב Diffie Hellman היא העברת המפתחות"],"note":"התקבלו כל הסעיפים","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":1},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":1}],"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_manual":true,"flags":["note"],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q014","year":"2022","stem":"תוקף הצליח לגנוב קובץ שמכיל סיסמאות לאימות של משתמשים. מטעמי אבטחה, כל הסיסמאות בו לא נשמרו כמות שהן, אלא הוחלפו בhash שלהן. איזה מבין ההתקפות הבאות ינסה התוקף לבצע כדי להשיג את הסיסמאות המקוריות דרך הקובץ הנ\"ל?","options":["התקפת brute force","התקפת spoofing","התקפת sql injection","התקפת csrf"],"note":"","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":2},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022  אך אין לה יכולות אחרות, בפרט, לחווה אין יכולות MitM והיא אינה יכולה לשלוח הודעות לאליס/בוב כלל - גם לא לשלוח הודעות משוכפלות מאליס/בוב. מוצעות להלן מספר הצעות לקיום התקשורת בין אליס לבוב כך שהתקשורת תהיה מאובטחת. איזו שיטה לא תעבוד?","options":["אליס ובוב יתקשרו באמצעות הצפנה א-סימטרית. כל אחד מהם שולח לשני דרך הערוץ את המפתח הפומבי שלו ומאותו הרגע אליס שולחת לבוב את ההודעות שלה מוצפנות בעזרת המפתח הפומבי שלה (בוב אותו דבר, שולח הודעות שמוצפנות בעזרת המפתח הפומבי שלו).","אליס ובוב יתקשרו באמצעות הצפנה סימטרית. הם מקיימים ביניהם החלפת מפתחות מבוססת דיפי-הלמן ומאותו הרגע כל ההודעות מוצפנות בהתאם.","אליס ובוב יתקשרו באמצעות הצפנה סימטרית. הם ישלחו כל אחד לשני את התעודה שCA שכולם סומכים עליו הנפיק לכל אחד מהם, ואז יריצו את אלגוריתם דיפי-הלמן (וישתמשו בתעודות לאבטחת התהליך) ומאותו הרגע כל ההודעות מוצפנות בהתאם.","אליס ובוב יתקשרו לסירוגין באמצעות הצפנה סימטרית והצפנה א-סימטרית. כאשר הם מתקשרים בהצפנה סימטרית הם מקיימים ביניהם החלפת מפתחות מבוססת דיפי-הלמן ומאותו הרגע כל ההודעות מוצפנות בהתאם. כאשר הם מתקשרים באמצעות הצפנה א-סימטרית הם ישלחו כל אחד לשני את התעודה שCA שכולם סומכים עליו הנפיק להם ומאותו הרגע כל ההודעות מוצפנות בהתאם (כמו שמצפינים ומפענחים בהצפנת מפתח פומבי רגילה)."],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":1},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":1},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.288,"exam_count":1,"in_sample_exam":true,"variant_group":"V06"},{"id":"Q026","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["אליס בנתה אתר בית שרץ על foo.com בכתובת: http://foo.com/~alice ונתנה גישה לאתר הבית שלה לכל חבריה. לבוב, שאינו חבר של אליס, יש אתר בית משלו על foo.com בכתובת: http://foo.com/~bob. בוב החליט שכאשר ויקי, אחת מחברותיה של אליס, תגלוש לאתר הבית שלו, הוא ישים באתר הבית שלו iframe\nעם כתובת האתר של אליס ויקרא ממנו את התוכן של אתר הבית של אליס באמצעות javascript. כאשר בוב ינסה זאת, הוא יגלה, לצערו, שמנגנון ה same origin policy ימנע מהסקריפט שלו גישה למידע החוזר מאתר הבית של אליס.","ניצול חולשת SQL injection כדי לבצע התקפת XSS הינו תרחיש הגיוני.","אתר מסויים השתמש בחיטוי קלט כדי למנוע התקפות SQL injections. האתר הסיר את התווים: '=- (כל אחד בנפרד) מהקלטים של המשתמשים. למרבה הצער, הם שכחו את התו ; וזה מה שגרם להתקפת sql injection כנגד האתר. זאת דוגמא קלאסית לחסרון של שיטת blacklisting.","בהתקפות stored XSS ו reflected XSS, הקוד הזדוני מוחזר כחלק מהתשובה של השרת"],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":2},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":2},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.328,"exam_count":1,"in_sample_exam":true,"variant_group":null},{"id":"Q027","year":"2022","stem":"איזו מבין הטענות הבאות נכונה?","options":["miner שמתחזק את כל הבלוקצ'יין באופן שוטף, יכול לעקוב אחר טרנזקציות ולדעת כמה ביטקוין יש לכתובת ביטקוין מסויימת ברגע נתון","כדי לבזבז ביטקוין אין צורך במפתח הפרטי של הארנק הרלוונטי","ביצוע שינויים במטבע הביטקוין מחייב אישור של סטושי","ב micro payments, אליס חייבת לסמוך על בוב (ספק השירות) שישחרר לה את הכסף המגיע לה"],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":3},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":3},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.312,"exam_count":1,"in_sample_exam":true,"variant_group":null},{"id":"Q028","year":"2022","stem":"איזו מבין הטענות הבאות נכונה?","options":["הכח של ההמונים, למשל באמצעות botnet, הוא הכח המניע מאחורי התקפת DDoS","התקפת קמינסקי היא בראש ובראשונה התקפת DoS","התקפות DoS נעשות אך ורק בשכבה הפיזית, הלינק, התעבורה, והרשת","ראשי התיבות DoS הן של התקפות Disk on Stack"],"note":"","sources":[{"f וריתם הצפנה (ופענוח) סימטרי?","options":["DES","RSA","Hellman-Diffie","SHA256"],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":3},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.278,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q040","year":"2023","stem":"איזו מהטענות הבאות אינה נכונה?","options":["Metasploit הינו חומת אש אפליקטיבית.","סריקת כתובות IP ופורטים פתוחים היא טכניקה המאפשרת השתלטות על מחשבים וגיוסם כבוטים.","בעזרת סריקת כתובות IP אפשר לאסוף מידע על הקורבנות.","חומת אש יכולה להיות מותקנת על מכשירי קצה (של לקוחות) או על שרתים או על רכיבי תקשורת מרכזיים."],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":4},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.222,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q041","year":"2023","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["ב syn-flood תוקף יעדיף כתובת IP מזוייפות כ source ובעיקר כאלו שלא יענו, כדי, בין השאר, לשפר את הסיכוי שישלח בחזרה RST על ה syn+ack","IDS אינו מונע התקפות DNS poisoning","תוקף בעל יכולות eavesdropping בין קורבן לשרת ה DNS שאליו פנה לא תמיד יצליח בהתקפת DNS poisoning","על מנת לבצע ARP poisoning, התוקף אינו זקוק ליכולת MITM"],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":5},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.373,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q042","year":"2023","stem":"אילו מהטענות הבאות נכונה?","options":["כיום, אחת השיטות הנפוצות לכרות ביטקוין היא באמצעות mining pools.","אם אליס היא הבעלים כרגע של x ביטקוין כתוצאה מטרנזקציה y, היא תמיד תהיה הבעלים של המטבעות הללו, בתנאי שהיא לא בזבזה אותם.","הבנק שעומד מאחורי ביטקוין דואג להזרים כסף למערכת לפי הצורך.","אחד היתרונות של ביטקוין הוא שהוא מונע double spending לחלוטין."],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":6},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.259,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q043","year":"2023","stem":"במנגנון החלפת המפתחות של דיפי הלמן מחליטים על שני מספרים פומביים n,g ואז אליס ובוב כל אחד בוחרים מספר סודי x, ובעזרת מספרים אלו מחשבים את y. הסעיפים הבאים מתארים תהליכים שמתרחשים או קשורים למנגנון. בחרו את הסעיף שאינו נכון.","options":["אליס ובוב (כל אחד בנפרד) מעלים את x בחזקת g (מודולו n) וכך מחשבים את y. הם שולחים את התוצאה אחד לשני (אליס לבוב ובוב לאליס).","אליס מקבלת מבוב את y, ומעלה אותו בחזקת x (מודולו n). התוצאה המתקבלת היא המפתח המשותף.","אליס ובוב (כל אחד בנפרד) מעלים את g בחזקת x (מודולו n) וכך מחשבים את y. הם שולחים את התוצאה אחד לשני (אליס לבוב ובוב לאליס).","בוב מקבל מאליס את y, ומעלה אותו בחזקת x (מודולו n). תוקף מאזין אינו יכול לגלות את המפתח המשותף בגלל הקושי של בעיית הלוגריתם הדיסקרטי."],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":7},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.465,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q044","year":"2023","stem":"נתון:\n• PKA הינו המפתח הפומבי של אליס ו SKA הוא המפתח הפרטי של אליס. בוב יודע את PKA.\n• PKB הינו המפתח הפומבי של בוב ו SKB הוא המפתח הפרטי של בוב. אליס יודעת את PKB.\n• Enc<sub>x<\/sub> הינה פונק׳ הצפנה סימטרית עם המפתח x, ו Dec<sub>x<\/sub> הינה פונק׳ הפענוח הסימטרית.\n• E<sub>x<\/sub> הינה פונק׳ הצפנה אסימטרית עם המפתח x , ו D<sub>y<\/sub> הינה פונק׳ הפענוח האסימטרית עם המפתח y.\n• H הינה פונק׳ hash.\n• S<sub>x<\/sub> הינה פונק׳ המבצעת חתימה דיגיטלית עם המפתח x, ו V<sub>y<\/sub> הינה פונק׳ וידוא חתימה דיגיטלית עם המפתח y. אליס רוצה לשלוח הודעה M (קצרה) בצורה מאובטחת לבוב. הדרישה היא שהאופן בו ההודעה נשלחת יקיים סודיות, ויאפשר לבוב וידוא אותנטיות השולח ואמינות המידע. להלן הצעות שונות כיצד אליס רוצה לעשות זאת. ביחרו את ההצעה (היחידה) שמקיימת את הדרישה.","options":["אליס שולחת לבוב:\nE<sub>PKB<\/sub>(M),S<sub>SKA<\/sub>(H(M))","אליס מייצרת מפתח סימטרי סודי s, ושולחת לבוב:\nE<sub>PKB<\/sub>(s),Enc<sub>s<\/sub>(M)","אליס מייצרת מפתח סימטרי סודי s, ושולחת לבוב:\nE<sub>PKA<\/sub>(s),Enc<sub>s<\/sub>(M)","אליס שולחת לבוב:\nE<sub>PKB<\/sub>(M),S<sub>SKB<\/sub>(H(M))"],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":8},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.275,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q045","year":"2023","stem":"ssh הוא פרוטוקול סטנדרטי לתקשורת בין קליינט לסרבר מעל TCP. שרת ssh מאזין בפורט 22 עבור בקשות חיבור נכנסות. ברשת מסויימת יש שרת ssh וכמו כן שרת פרוקסי. שרת הפרוקסי מאזין בפורט 8080 (בלבד). רוצים לבנות טבלת חוקים ב firewall שתאפשר תנועה נכנסת ויוצאת של תעבורת ssh בלבד, כלומר, רוצים לאפשר קיום תקשורת ssh מתוך הרשת החוצה ומחוץ לרשת פנימה, אבל, שלא תתאפשר שום תעבורה אחרת. לכן הגדירו את הטבלה הבאה: (סדר החוקים מופיע בעמודה הימנית והוא גם סדר השורות בטבלה. כלומר, החוק הראשון הוא ראשון גם מבחינת סדר וכו')\n| חוק מספר | כיוון תעבורה | Src IP | Src port | Destination IP | Destination Port | פרוטוקול | פעולה |\n| 1 | נכנסת | חיצונית | * | פנימית | 22 | TCP | Allow |\n| 2 | יוצאת | פנימית | 22 | חיצונית | * | TCP | Allow |\n| 3 | יוצאת | פנימית | * | חיצונית | 22 | TCP | Allow |\n| 4 | נכנסת | חיצונית | 22 | פנימית | * | TCP | Allow |\n| 5 | * | * | * | * | * | * | Drop |\nאיזה טענה אינה נכונה?","options":["תוקף שנמצא מחוץ לרשת אינו יכול להקים חיבור TCP מול שרת הפרוקסי שנמצא בתוך הרשת.","ניתן היה לשפר את הבטיחות של הטבלה הנ\"ל בעזרת הוספת עמודת flags, כלומר, לאפשר להגדיר חוק גם לפי דגלי TCP.","החוקים כתובים בצורת whitelist.","טבלת החוקים המתוארת בשאלה מאפשרת תנועה נכנסת ויוצאת של תעבורת ssh מהרשת החוצה ומחוץ לרשת פנימה."],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":9},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.222,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q046","year":"2023","stem":"להלן מספר הצעות לשינויים לרשת ביטקוין, כאשר כל שינוי מלווה בטענה. עליכם לבחור את הסעיף עם הטענה שאינה נכונה.","options":["כדי לחסוך בחשמל, מציעים שכריית בלוקים חדשים תתבצע רק כאשר יש כמות x של עסקאות חדשות שרוצות להיכנס לבלוקצ׳יין. כלומר, אם כרגע ידוע על פחות מ x עסקאות חדשות, הminerים לא עושים כלום, והם יתחילו לחפש את הבלוק הבא רק כאשר יהיו x עסקאות חדשות או יותר. שינוי זה אינו מאפשר לתוקף לבצע double-spending.","לאליס יש בעלות על 1 ביטקוין, ותוקף רשע ומרושע רוצה למנוע ממנה להעביר אותו למישהו אחר. התוקף שלנו הינו גאון, והצליח לפתח חומרה מיוחדת שמחשבת hash יותר מהר מכל miner קיים. למעשה, החומרה הזו כל כך חזקה, כך שכאשר הוא משתמש בה, היא מהווה 51% מהכוח החישובי של כל רשת הביטקוין. חומרה זו מאפשרת לו להשיג את מטרתו, אפילו אם אליס לעיתים תחשוב (זמנית) שהיא הצליחה להעביר את הביטקוין שלה למישהו אחר.","אליס מחליטה לממש בעצמה תוכנה שתעקוב אחר הבלוקצ׳יין ותוודא את תקינות הבלוקים והטרנזקציות בו. אליס חוששת שיגמר לה הזיכרון אם היא תשמור את כל הבלוקצ׳יין. לכן, במקום לשמור את כל הבלוקצ׳יין, היא שומרת את הבלוק האחרון שנוסף לבלוקצ׳יין ואת רשימת כל העסקאות שעדיין לא בוזבזו. כאשר היא שומעת על בלוק חדש שנוסף, היא עושה את כל הבדיקות הרגילות שמחשבים שחברים בביטקוין עושים, כלומר, שהבלוק החדש כולל hash של הבלוק האחרון הנוכחי, שכל העסקאות בבלוק החדש תקינות (חתומות תקין, מבזבזות עסקאות שלא בוזבזו בלבד וכו׳), הhash של הבלוק מכיל מספיק אפסים וכו׳. אם הבלוק תקין, התוכנה שומרת אותו במקום הבלוק האחרון הנוכחי ששמור, ומעדכנת את רשימת העסקאות שלא בוזבזו בהתאם. המימוש הזה בעייתי ביחס למימוש הרגיל (שיש לו את כל הבלוקצ׳יין), בגלל שאינו מתמודד טוב עם פיצולים (forks).","נניח שלוקח 1 דקה עד שעסקה חדשה שפורסמה או בלוק חדש שנמצא מגיעים לכל המחשבים ברשת הביטקוין מהרגע שהם נוצרו (שהרי ביטקוין היא רשת peer to peer ולוקח זמן למידע להתפשט ברשת ממחשב אחד לשני). מציעים להוריד את משך הזמן הממוצע עד מציאת בלוק חדש מ10 דק׳ ל10 שניות. רעיון זה אינו טוב."],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":10},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.263,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q047","year":"2023","stem":"הבטיחות של מנגנון החלפת המפתחות של דיפי-הלמן מתבססת על?","options":["בעיית הלוגריתם הדיסקרטי","פרדוקס יום ההולדת","מנגנון One time pad","עקרון קרקהוף"],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":1},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.324,"exam_count":1,"in_sample_exam":false,"variant_group":"V08"},{"id":"Q048","year":"2023","stem":"איזו טענה אינה נכונה?","options":["ב Certificate Transparency משתמשים ב cookie למציאת התעודה הבאה","בביטקוין משתמשים ב proof of work למציאת הבלוק הבא","ב Certificate Transparency משתמשים במבנה הנתונים עץ מרקל","בביטקוין משתמשים במבנה הנתונים עץ מרקל"],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":2},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.257,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q049","year":"2023","stem":"איזו טענה אינה נכונה?","options":["ב One time pad הבטיחות תלויה בטקסט שרוצים להצפין","ב One time pad לא משתמשים באותו מפתח יותר מפעם אחת","ב One time pad המפתח צריך להיות בגודל הטקסט","ב One time pad ההצפנה והפענוח מתבצעות על ידי xor"],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":3},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.292,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q050","year":"2023","stem":"מחשב סטנדרטי ברשת ביטקוין שמריץ תוכנת ביטקוין סטנדרטית מקבל בלוק חדש והוסיף אותו לעותק המקומי של הבלוקצ׳יין (בתור הבלוק הבא בתור). איזה מבין הטענות הבאות אינה נכונה?","options":["המחשב מוסיף חתימה משלו לבלוק.","ה hash של הבלוק מתחיל עם מספיק אפסים בהתאם לכמות הנדרשת כעת.","הבלוק אינו מכיל double spending של טרנזקציה אחרת שקיימת באחד מהבלוקים שקודמים לו בבלוקצ׳יין.","הבלוק מכיל טרנזקציה אחת לפחות."],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":4},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":4},{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.296,"exam_count":2,"in_sample_exam":false,"variant_group":null},{"id":"Q051","year":"2023","stem":"תעודות הינן רכיב חשוב בתקשורת מאובטחת. איזה מידע אסור שיופיע בתעודה?","options":["מפתח פרטי","התאריך שממנו התעודה תקפה","החתימה הדיגיטלית של ה CA שחתם על התעודה","השם של ה CA שחתם על התעודה"],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":5},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.176,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q052","year":"2023","stem":"איזו מהטענות הבאות נכונה?","options":["שולחים בקשת DNS מפורט אקראי כדי להקשות על ניחוש הפורט ע\"י תוקף.","בכדי ש SSL/TLS יגן על מידע רגיש, חובה על הלקוח והשרת להיות מצוידים בתעודה תקנית המוכיחה את זהותם.","אפשר להשתמש בבוטים רק למטרות DDoS.","משתמשים ב DMZ כאשר לא ניתן להשתמש בחומת אש."],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":6},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.169,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q053","year":"2023","stem":"לאליס יש ביטקוין 1 כתוצאה מטרנזקציה X1 בבלוק B1. אליס מבזבזת את המטבע בטרנזקציה X2 בבלוק B2. לאחר כמה שעות, אליס מבינה שהיא טעתה, והעבירה בעלות על המטבע לארנק הלא נכון. לכן, אליס משנה את העותק הלוקאלי של הבלוקצ'יין שלה, כך שיכיל בלוק אחר במקום בלוק B2, והבלוק החדש יכיל את הטרנזקציה המתוקנת. אליס שולחת לעמיתיה את הבלוק המתוקן וממשיכה לבנות את הבלוקצ'יין על בסיס הבלוק הזה. מהי הטענה הנכונה?","options":["כל עוד הבלוקצ'יין המעודכן המוצע ע\"י אליס אינו ארוך יותר מהמקורי, סיכוייה להצליח אינם גבוהים.","אליס תצליח תמיד לתקן את הטעות שעשתה.","אליס תלויה בבנקאי שיאשר לה את הבקשה להחלפת הבלוק.","כדי שאליס תצליח, עליה להמשיך ולכרות על השרשרת הלוקאלית שלה למשך לפחות 100 בלוקים, מה שיבטיח ששאר העמיתים יקבלו את השרשרת שלה בתור השרשרת המוסכמת."],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":7},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.214,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q054","year":"2023","stem":"נתון שרת שהותקף במתקפת DDoS מסוג HTTP flood. לגבי החבילות שהקורבן (השרת שהותקף) קיבל במהלך ההתקפה, איזה מהשדות הבאים בחבילות היו בעלי ערכים שונים ואילו בעלי ערכים זהים?","options":["ערכים שונים – Source IP, Source Port, ערכים זהים – Destination IP, Destination port","ערכים שונים – Destination IP, Source Port, ערכים זהים – Source IP, Destination port","ערכים שונים – Source IP, Destination port, ערכים זהים – Destination IP, Source port","ערכים זהים – Source IP, Source Port, ערכים שונים – Destination IP, Destination port"],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":8},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.252,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q055","year":"2023","stem":"נתון ciphertext באורך 7 תוים, אשר כולם זהים. ה ciphertext נוצר על ידי צופן החלפה (צופן החלפה ממש ולא \"סתם\" צופן הזזה), ונתון שהא\"ב של השפה מורכב מ 28 תוים. כמה plaintexts ישנם שיכולים להתאים ל ciphertext הנ\"ל?","options":["28","28 בחזקת 7","28 * 7","7!"],"note":"התקבל גם סעיף ב","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":9},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":9}],"flags":["note"],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.308,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q056","year":"2023","stem":"אליס ובוב רוצים לדבר ביניהם בצורה מוצפנת ומאובטחת כך שחווה לא תוכל לדעת מה תוכן ההודעות שהם שולחים אחד לשניה. הדרך היחידה של אליס ובוב לתקשר הוא דרך ערוץ התקשורת שביניהם. נתון שלחווה יש יכולות האזנה, כלומר היא יכולה לראות הודעה הנשלחת בין אליס לבוב אך אין לה יכולות אחרות, בפרט, לחווה אין יכולות MitM והיא אינה יכולה לשלוח הודעות לאליס/בוב כלל - גם לא לשלוח הודעות משוכפלות מאליס/בוב. מוצעות להלן מספר הצעות לקיום התקשורת בין אליס לבוב כך שהתקשורת תהיה מאובטחת. באיזו שיטה אסור להם להשתמש?","options":["אליס ובוב יתקשרו באמצעות הצפנה סימטרית. כל אחד מייצר מפתח סימטרי משלו ושולח לשני דרך הערוץ ומאותו הרגע כל ההודעות מוצפנות בהתאם.","אליס ובוב יתקשרו באמצעות הצפנה א-סימטרית. כל אחד מהם שולח לשני דרך הערוץ את המפתח הפומבי שלו ומאותו הרגע כל ההודעות מוצפנות בהתאם.","אליס ובוב יתקשרו באמצעות הצפנת מפתח פומבי. הם ישלחו כל אחד לשני את התעודה שCA שכולם סומכים עליו הנפיק להם ומאותו הרגע כל ההודעות מוצפנות בהתאם (הצפנת מפתח פומבי רגילה).","אליס ובוב יתקשרו באמצעות הצפנה סימטרית. הם מקיימים ביניהם החלפת מפתחות מבוססת דיפי-הלמן ומאותו הרגע כל ההודעות מוצפנות בהתאם."],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":10},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":10},{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.264,"exam_count":2,"in_sample_exam":false,"variant_group":"V06"},{"id":"Q057","year":"2024","stem":"אליס לקחה plaintext והצפינה אותו, ואז חישבה MAC על ה plaintext. אליס שלחה לבוב את ה ciphertext ואת הtag. באיזה שיטה אליס עבדה?","options":["MAC and Encrypt","דיפי הלמן","Encrypt then MAC","MAC then Encrypt"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.318,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q058","year":"2024","stem":"בטרנזקציה x נעלו את הפלט בעזרת ה output script הבא:\n```\nDUP HASH160 [Key Hash] EQUALVERIFY CHECKSIG\n```\nמה מבין הבאים הינו input script מתאים שיאפשר לבזבז את ה output script בטרנזקציה עתידית?","options":["[Signature] [Public Key]","CHECKSIG EQUALVERIFY","[Public Key] [Key Hash]","[Key Hash] [Public Key]"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.362,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q059","year":"2024","stem":"נתון שתוקף הצליח לגנוב את המפתח הפרטי של אתר אינטרנט, אשר משמש אותו להקמת חיבורי TLS עם לקוחות. איזה טענה אינה נכונה?","options":["התוקף יוכל לזייף הודעות Online Certificate Status Protocol (OCSP) בשם ה CA שהנפיק את התעודה לאתר האינטרנט.","אם לתוקף יש העתק של תקשורת עבר מוצפנת שמבוססת על ה key exchange בין השרת ללקוחות שהתבצע בעזרת RSA עם המפתח שנגנב בהקמת חיבור TLS, הוא יוכל לפענח את התקשורת המוצפנת הזו.","תוקף בעל יכולת Man in the Middle יוכל להתחזות לשרת ולהצליח להקים חיבור TLS עם לקוחות כאילו הוא השרת.","אם האתר יגלה שהמפתח הפרטי שלו נגנב, הוא יפנה ל CA שהנפיק את התעודה לאתר האינטרנט ויבקש מה CA שיבטל אותה."],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.221,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q060","year":"2024","stem":"נתון שרת אשר בונה שאילתא בעזרת המחרוזת הבאה על בסיס ערכי המשתנים InputUsername, InputPassword, אשר נשלחים לשרת מהדפדפן:\n```\n\"SELECT * FROM users WHERE username = '\" + InputUsername + \"' AND password = '\" + InputPassword + \"'\"\n```\nאיזה ערכים יהוו sql injection תקין?","options":["InputUsername = alice, InputPassword = 1234' or '1' = '1","InputUsername = alice, InputPassword = 1234' and '1' = '1","InputUsername = alice, InputPassword = 1234' and \"1\" = \"1","InputUsername = 'Alice', InputPassword = 1234' or 1 = 1"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.275,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q061","year":"2024","stem":"איזה טענה נכונה?","options":["בהודעת ה client finish הלקוח שולח לשרת את תוצאת הפעלת הצפנה ו MAC על ה hash של ההודעות שנשלחו עד כה ב handshake והשרת מפענח ומוודא תקינות עם אותם מפתחות שהקליינט השתמש בהם כדי להצפין ולבצע MAC.","בהודעת ה server finish השרת שולח ללקוח את תוצאת הפעלת הצפנה ו MAC על ה hash של ההודעות שנשלחו עד כה ב handshake והלקוח מפענח ומוודא תקינות עם ה public key מהתעודה.","לאחר הקמת חיבור ה TLS, ההודעות שהלקוח שולח לשרת לאורך החיבור מוצפנות בעזרת מפתח X (מסויים), והשרת מפענח אותן בעזרת מפתח Y (ששונה מX).","לאחר הקמת חיבור ה TLS, ההודעות שהלקוח שולח לשרת לאורך החיבור מוצפנות בעזרת ה public key של השרת בהצפנה א-סימטרית."],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.284,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q062","year":"2024","stem":"נתון:\n- כתובת ה ip של אליס היא 192.168.0.1 וכתובת ה MAC שלה היא AA:AA:AA:AA:AA:AA\n- כתובת ה ip של בוב היא 192.168.0.2 וכתובת ה MAC שלו היא BB:BB:BB:BB:BB:BB\n- כתובת ה ip של התוקף היא 192.168.0.6 וכתובת ה MAC שלו היא 66:66:66:66:66:66 לאחר שהתוקף ביצע בהצלחה התקפת ARP poisoning, כאשר אליס שולחת הודעה לבוב, לאיזה כתובת ip היא תשלח ולאיזה כתובת MAC?","options":["לכתובת ip של 192.168.0.2 ולכתובת MAC של 66:66:66:66:66:66","לכתובת ip של 192.168.0.6 ולכתובת MAC של 66:66:66:66:66:66","לכתובת ip של 192.168.0.2 ולכתובת MAC של BB:BB:BB:BB:BB:BB","לכתובת ip של 192.168.0.6 ולכתובת MAC של BB:BB:BB:BB:BB:BB"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":6},{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.269,"exam_count":2,"in_sample_exam":false,"variant_group":null},{"id":"Q063","year":"2024","stem":"איזה טענה נכונה?","options":["מנגנון Certificate Transparency משתמש בעץ Merkle כדי ליצור שקיפות בהקשר של התעודות ש CAים מנפיקים, ומסייע בזיהוי מוקדם של תעודות זדוניות.","מנגנון Certificate Transparency הינו מנגנון המשמש להצפנת חיבורי TLS בין לקוח לשרת בהקשר של שקיפות אלגוריתמי ה cipher suites הנתמכים בין הלקוח לשרת.","מנגנון Certificate Transparency הינו מנגנון המשמש להצפנת חיבורי TLS בין שרת לשרת בהקשר של שקיפות אלגוריתמי ה cipher suites הנתמכים בין השרתים ולקוחותיהם.","מנגנון Certificate Transparency הינו מנגנון המשמש להצפנת חיבורי TLS בין לקוח לשרת בהקשר של שקיפות אלגוריתמי ה cipher suites המסוכמים בין הלקוח והשרת בהודעות ה server finish וה client finish."],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":8}],"topic":"PKI, תעודות, CT ו-OCSP","topic_manual":true,"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q064","year":"2024","stem":"אליס הצפינה בעזרת צופן DES (שגודל הבלוק שלו הוא 8 בתים) ושיטת הפעלה (mode of operation)\nשל ECB, את הbytes של ה plaintext הבא:\nABCDEFGHABCDEFGH עם מפתח ההצפנה שמורכב מהbytes של המחרוזת lemonlem . מה הייצוג ההקסדצימלי של ה bytes\nשל ה ciphertext שיצא לה?","options":["437d7e60707604f3437d7e60707604f3","618142157df60e232e6fea24db009df9","00112233445566778899aabbccddeeff","2e6fea24db009df9ced6000330c42994"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":2},{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.461,"exam_count":2,"in_sample_exam":false,"variant_group":null},{"id":"Q065","year":"2024","stem":"איזו מבין הטענות הבאות נכונה?","options":["אתר אינטרנט יכול להשתמש ב Content Security Policy (CSP) כדי להגדיר מאיזה כתובות מותר לטעון משאבים כמו קבצי JS שירצו באתר האינטרנט על ידי הדפדפן של הלקוח","ב PKI, שרת אינטרנט X שקיבל תעודה חתומה מ CA על ה public key שלו, חייב ש ה CA שנתן לו (ל X) את התעודה יהיה ב root store של הלקוחות","ב TLS, שרת האינטרנט מייצר את התעודה עבור חיבור ה TLS","על מנת לבצע התקפת ARP poisoning, התוקף זקוק ליכולת Man in the Middle"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.303,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q066","year":"2024","stem":"איזו מבין הטענות הבאות נכונה?","options":["ב לומר, את הפלט של ביצוע MAC בעזרת המפתח K על ההודעה M)\n- Enc<sub>PK<sub>B<\/sub><\/sub>(K) (כלומר, תוצאת ההצפנה של המפתח K, כאשר ההצפנה הינה הצפנה א-סימטרית בעזרת המפתח הפומבי האמיתי של בוב.)\n- Sign<sub>SK<sub>A<\/sub><\/sub>(hash(K)) (כלומר, חתימה דיגיטלית על תוצאת ביצוע hash על K, כאשר החתימה מבוצעת בעזרת המפתח הפרטי של אליס)\nנתון כי בוב וקרול יודעים את המפתח הפומבי האמיתי של אליס, ואלגוריתמי ה MAC, ההצפנה, החתימה וה hash המצויינים בשאלה בטוחים.\nמהי הטענה הנכונה מבין הבאות?","options":["צורת הפעולה של אליס המתוארת בשאלה אינה מבטיחה את תכונת ה authenticity, כי לאחר שבוב יקבל הודעה מאליס הוא יוכל לגרום לקרול לחשוב שאליס שלחה לקרול הודעה שאליס לא שלחה כלל.","צורת הפעולה של אליס המתוארת בשאלה מבטיחה את תכונת ה integrity וגם תכונת ה authenticity, אבל לא מבטיחה סודיות.","צורת הפעולה של אליס המתוארת בשאלה מבטיחה את תכונת ה integrity וגם תכונת ה authenticity, ולמרות שלא מעניין את אליס סודיות, היא גם מבטיחה סודיות.","צורת הפעולה של אליס המתוארת בשאלה אינה מבטיחה את תכונת ה integrity ותכונת ה authenticity, כי אליס שולחת את ההודעה M בצורה גלויה, מה שנוגד את תכונות ה integrity ו authenticity."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.25,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q079","year":"2024","stem":"איזו מהטענות הבאות אינה נכונה לגבי מנגנון הבלוקצ'יין בביטקוין?","options":["הבלוקצ'יין משתמש ב Merkle Tree כדי להבטיח את פרטיות העסקאות, כך שרק המשתתפים הישירים בעסקה יכולים לראות את פרטי העסקה המלאים","ביטקוין משתמש במנגנון של hash, כדי לחשב את ה digest של בלוקים בבלוקצ׳יין.","ביטקוין משתמש במנגנון של Proof of Work, שבו כורים מתחרים בפתרון חידה קריפטוגרפית מורכבת על מנת להוסיף בלוקים חדשים לשרשרת.","ביטקוין מאפשר לכורים לבחור את העסקאות שיופיעו בבלוקים, ולכן, אם כורה רוצה, הוא יכול להרכיב בלוק של עסקאות שנותנות עמלות נמוכות, למרות שיש עסקאות אחרות שהכורה יכל לבחור בהן שנותנות עמלות גבוהות יותר."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.313,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q080","year":"2024","stem":"איזו מהטענות הבאות אינה נכונה?","options":["אם CA הנפיק תעודה עבור שרת אינטרנט כלשהו (לא מדובר על שרת האינטרנט של הארגון שאליו שייך ה CA), ה CA הזה יכול לפענח תעבורת TLS בין שרת האינטרנט והלקוחות של שרת האינטרנט.","בהינתן MAC של הודעה שחושב על ידי בוב, אליס אינה יכולה להוכיח לאחרים על בסיס MAC זה שההודעה נשלחה בהכרח על ידי בוב.","תוקף מעוניין לגנוב cookie של סטודנטים באתר colman.ac.il. לשם כך הוא בונה אתר שלו בכתובת evil.co.il ושם סקריפט בעמוד הראשי של evil.co.il שניגש ל cookie של הלקוח באתר colman.ac.il ושולח את הcookie לתוקף. התקפה זו תיחסם על ידי הדפדפן.","מתקפת XSS עשויה להיות תולדה של מתקפת SQL injection."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.21,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q081","year":"2024","stem":"אליס רצתה להבטיח את שלמותה (אמינות/אותנטיות) ואת סודיותה של הודעה שהיא שולחת. ולכן, היא הצפינה את ההודעה וחישבה MAC על ה ciphertext. באיזה שיטה עבדה אליס?","options":["Encrypt then MAC.","MAC and Encrypt.","Sign then Encrypt.","MAC then Decrypt."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.288,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q082","year":"2024","stem":"תכונת ה pre image resistance מוגדרת כ: (h הינה פונק׳ hash)","options":["בהינתן digest d של הודעה אקראית, קשה למצוא הודעה m כך ש h(m)=d","בהינתן הודעה אקראית m, קשה למצוא הודעה m’ ששונה מ m, כך ש h(m) = h(m’)","בהינתן הודעה אקראית m, קשה למצוא הודעה m’ ששונה מ m, כך ש h(m) שונה מ h ט שיצא בפעם הקודמת של הפעלת ה hash), ושומרים ב db את\nהusername, את ה salt ואת תוצאת ביצוע ה hash אחרי הפעם ה i.","כאשר משתמש נרשם למערכת, מגרילים salt (שהינו אקראי וארוך) שוב ושוב i פעמים, כלומר, מגרילים פעם אחת ומתעלמים מהתוצאה, מגרילים פעם נוספת ומתעלמים מהתוצאה, ורק על ה salt שיוצא בפעם הi מחשבים hash פעם אחת על שרשור של הsalt והסיסמא של המשתמש ושומרים ב db את הusername, את ה salt ואת תוצאת ביצוע ה hash.","כאשר משתמש נרשם למערכת, מגרילים ערך i אקראי, ומחשבים hash פעם אחת על שרשור של ערך הi שיצא והסיסמא של המשתמש ושומרים ב db את הusername, את ערך ה i ואת תוצאת ביצוע ה hash.","כאשר משתמש נרשם למערכת, מגרילים salt (שהינו אקראי וארוך) שוב ושוב i פעמים, כלומר, מגרילים פעם אחת ומתעלמים מהתוצאה, מגרילים פעם נוספת ומתעלמים מהתוצאה. לוקחים את ה salt שיוצא\nבפעם הi ומחשבים hash על ה salt (שיצא בפעם הi), אך במקום ביצוע hash פעם אחת - עושים hash\nשוב ושוב i פעמים (בכל פעם שעושים שוב hash כוללים בקלט את הפלט שיצא בפעם הקודמת של הפעלת ה hash), ושומרים ב db את הusername, את ה salt ואת תוצאת ביצוע ה hash אחרי הפעם ה i."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.226,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q086","year":"2024","stem":"אילו מהסכנות הבאות עלולות להתרחש אם משתמשים באותם מפתחות בשני הכיוונים (מהלקוח לשרת ומהשרת ללקוח), והן אינן מתקיימות במידה ומשתמשים במפתחות שונים לכל כיוון?","options":["מתקפת reflection, כלומר התוקף יכול לשלוח ללקוח הודעה שהלקוח שלח לשרת, כאילו השרת שלח אותה.","התקפת One time pad.","שיבוש ביטים בהודעה.","מתקפת האזנה, כלומר, התוקף יוכל להסניף את ה plaintext."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":10}],"topic":"TLS / HTTPS","topic_manual":true,"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q087","year":"2024","stem":"להלן רשימה של סקריפטים המייצגים ביצוע של ט 'Alice', InputPassword: ' or 1 = 1"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.26,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q096","year":"2024","stem":"נתון plaintext הבא: \"QUIZ\" (הplaintext הוא ללא הגרשיים). לפי צופן קיסר (צופן קיסר ממש כפי שנלמד ולא צפנים כלליים יותר), מה יהיה ה ciphertext?","options":["TXLC","RVMC","NLLW","OXFY"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.368,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q097","year":"2024","stem":"בצופן Vigenère, המפתח ״CODE״ (בלי הגרשיים) משמש להצפנה של plaintext שהינו באורך 5 תווים. נתון שכל אות ב plaintext נבחרה באקראי מתוך 26 אותיות האלפבית. מה ההסתברות ששני תווים מוצפנים זהים יופיעו במרחק של 4 תווים אחד מהשני ב ciphertext?\n(יופיעו במרחק של 4 תווים אחד מהשני ==> בין המופע הראשון של התו למופע השני יש 3 תווים אחרים)","options":["1/26","1/13","1/16","1/4"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.292,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q098","year":"2024","stem":"איזו מהטענות הבאות על Certificate Transparency היא לא נכונה?","options":["CA חייב להשתמש ב CT logs כדי לרשום את כל התעודות שהוא מנפיק, אך לא כל רשומה ב log חייבת להיות גלויה לציבור.","Certificate Transparency מבוססת על שימוש ב public logs כדי לאפשר מעקב אחרי תעודות שניתנו על ידי CAים, ובכך לזהות בהקדם תעודות לא מורשות או מזויפות.","Certificate Transparency מאפשרת לבצע קריאות לשירותי CT logs כדי לבדוק אם תעודה נרשמה בלוגים פומביים.","Certificate Transparency כוללת את השימוש ב-SCT (Signed Certificate Timestamp), והדפדפן בודק את תקינות ה-SCT לפני שמאשר שימוש בתעודה."],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.441,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q099","year":"2024","stem":"Alice ו Bob, מחליפים מפתח באמצעות פרוטוקול Diffie-Hellman, כאשר נתון ש n = 23 ו g = 5.\nAlice בוחרת x = 6 ו Bob בוחר x = 15. מהו המפתח הסודי המשותף של Alice ו-Bob בסוף התהליך?","options":["2","5","19","8"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.326,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q100","year":"2024","stem":"Alice משתמשת ב-RSA כדי ליצור חתימה דיגיטלית עבור הודעה שהיא שולחת ל-Bob. היא בוחרת שני מספרים ראשוניים, p = 13 ו q = 17 ובעזרתם מחשבת את n. Alice בוחרת מפתח פרטי d = 5 ומפתח פומבי e = 77. ההודעה m שהיא רוצה לחתום עליה היא m = 7. מהי החתימה שאותה Alice תשלח לבוב?","options":["11","21","12","193"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.349,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q101","year":"2024","stem":"מה היתרון של OCSP Stapling לעומת OCSP רגיל?","options":["הוא מאפשר לשרת האינטרנט לשלוח את סטטוס התעודה לדפדפן באופן מיידי, מה שמפחית את העומס וההשהיה שנגרמת מתקשורת עם שרתי OCSP.","הוא מאפשר לשרת להצפין את הנתונים בין הדפדפן לשרת ה OCSP.","הוא מספק גיבוי מאובטח לשרת האינטרנט במקרים שבהם הוא אינו זמין, וכך מאפשר המשך פעילות תקינה.","הוא מעביר את הבדיקה לתשתית PKI שמונעת את הצורך באימות דו-שלבי."],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.232,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q102","year":"2024","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["שימוש ב x-frame-options מיועד להגנה מפני sql injection","ב TLS, משתמשים ב chain of trust","בקריפטוגרפיה, MAC המיושם נכון מספק אמינות המידע","בעיה גדולה ב One Time Pad היא העברת המפתחות"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.175,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q103","year":"2025","stem":"להלן מספר שיטות לשמירת סיסמאות ב DB, כאשר כל שיטה מתארת את מבנה הטבלה (המידע שישמר בכל עמודה מופרד בפסיקים, והסימן || מסמל שירשור). Hash הינה פונק׳ hash בטוחה קריפטוגרפית. Salt הינה מחרוזת בגודל 256 ביט הנבחרת באקראי. איזה מבין השיטות הבאות אינה פרקטית?\nכלומר, האפליקציה שמנסה לאמת את המשתמשים בעזרת הטבלה הזאת לא תוכל לעשות זאת בזמן סביר אם הטבלה תיושם לפי השיטה הספציפית?","options":["Username, hash(salt), hash(password || salt)","Username, salt, hash(password || salt || username)","Username, salt, hash(hash(password || salt))","Username, salt, hash(password || salt)"],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":1},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":1},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.295,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q104","year":"2025","stem":"אליס רוצה להשתמש ב textbook RSA . לשם כך, היא מריצה את אלגוריתם ה Gen. אליס התחילה את הרצת ה Gen ולכן בחרה שני מספרים ראשוניים: p=3, q=17, ובעזרתם חישבה: n=51. על בסיס נתונים אלו, מהי התוצאה של (n)ϕ?\nכאשר הפונקציה ϕ (האות היוונית phi) היא כפי שלמדנו בכיתה עבור אלגוריתם ה Gen.","options":["32","50","1","11"],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":2},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":2},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.395,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q105","year":"2025","stem":"בהקשר של חתימה דיגיטלית לפי textbook RSA (כלומר ללא hash), אם ידוע שה private key הוא:\nn = 33 d = 7\nמהי החתימה הדיגיטלית על ההודעה m כאשר m = 5?","options":["14","26","5","61"],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":3},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":3},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.501,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q106","year":"2025","stem":"איזה מבין הטענות הבאות נכונה?","options":["עץ מרקל מאפשר לאמת אם טרנזקציה כלולה בבלוק מבלי להחזיק את כל הטרנזקציות של הבלוק.","עץ מרקל משמש לחישוב כתובת הארנק של משתמשי ביטקוין.","עץ מרקל מאפשר לבצע הצפנה על כל טרנזקציה באופן נפרד.","עץ מרקל משמש להצפנת הכתובות של השולחים והמקבלים בכל טרנזקציה."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":4},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":4},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.269,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q107","year":"2025","stem":"איזה מבין הטענות הבאות אינה נכונה בהקשר של TLS?","options":["ב ClientHello השרת מעביר ללקוח את ה cipher suite שהוא רוצה שהשרת והלקוח ישתמשו בו.","ב-TLS handshake השרת שולח ללקוח את תעודת השרת, אשר מכילה את מפתח ההצפנה הציבורי של השרת.","השרת מעביר ללקוח את התעודה של השרת, והלקוח צריך לוודא את התקינות של התעודה, בין השאר, לוודא שה subject שכתוב בתעודה (שעבורו הונפקה התעודה) הוא אכן השרת שהלקוח רוצה להקים איתו חיבור TLS.","השרת מעביר ללקוח את התעודה של השרת, והלקוח צריך לוודא את התקינות של התעודה, בין השאר, לוודא שתוקף התעודה לא פג."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":5},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":5},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.312,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q108","year":"2025","stem":"מה תפקידו של מנגנון OCSP stapling?","options":["לאפשר לשרת אינטרנט לשלוח ללקוח את הסטטוס המעודכן של התעודה של השרת (אם בוטלה או לא), בלי שהלקוח יצטרך לפנות בעצמו לשרת ה OCSP.","לאחסן רשימה של כל התעודות שה CA ביטל.","לייתר את הצורך לבדוק את ה chain of trust.","מדובר במנגנון challenge הנועד לוודא ששרת אינטרנט שפנה ל CA בטענה לבעלים של דומיין מסויים הוא אכן הבעלים של הדומיין הזה."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":6},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":6},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.285,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q109","year":"2025","stem":"השם המלא של אליס הוא אליס אליסוביץ׳. לאחרונה, אליס נרשמה לאתר אינטרנט מסוים בשמה המלא (כפי שהופיע במשפט הקודם), אך שמה לב לתופעה מוזרה. במקומות מסוימים, האתר מציג את שמה נכון:\nאליס אליסוביץ׳\nאך במקומות מסוימים אחרים שקשורים לאתר הזה, שמה מוצג בצורה שונה:\nאליס אליסוביץ`&#39;`\nמהי הסיבה לכך?","options":["שימוש במנגנון קידוד (encoding) על ידי האתר על מנת למנוע התקפות injection.","השרת הגדיר Content Security Policy עבור מנגנון OCSP.","שימוש במנגנון ה preload ב HSTS בלי רישום באתר https://hstspreload.org","תופעת לוואי של מנגנון ה anti CSRF token."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":7},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":7},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.199,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q110","year":"2025","stem":"תוקף הצליח לגנוב את המפתח הפרטי של שרת אינטרנט מסוים. לקוחות מתקשרים מול שרת האינטרנט הזה בעזרת חיבורי TLS מבוססי RSA. שרת האינטרנט לא יודע שהמפתח הפרטי נגנב והתעודה הנוכחית שהונפקה עבורו היא התעודה היחידה שאי פעם היה לו. איזה מבין הטענות הבאות אינה נכונה?","options":["התוקף יכול לחתום על ה CRL של ה CA שהנפיק את התעודה של שרת האינטרנט, ולקבוע איזה תעודות יכללו ב CRL הזה.","אם לתוקף יש יכולת Man in the Middle כאשר לקוח מקים חיבור TLS מול שרת האינטרנט הנ״ל, התוקף יכול כעת להשלים חיבור מול הלקוח תוך התחזות אל שרת האינטרנט והלקוח יחשוב שהוא הקים חיבור TLS עם שרת האינטרנט האמיתי כשבפועל החיבור הוקם מול התוקף.","אם לתוקף יש עותק של תעבורת https ישנה של השרת אינטרנט הנ״ל מול לקוחות, התוקף יכול כעת לפענח את התעבורה הזו ולראות את ה plaintext שנשלח בה.","התוקף יכול לחתום על מידע כלשהו בשם שרת האינטרנט, כך שהמידע יראה ככזה שבאמת נחתם על ידי שרת האינטרנט."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":8},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":8},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.217,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q111","year":"2025","stem":"אתר מסויים מאפשר למנהלים לשנות את הסיסמה של כל משתמש דרך בקשת GET לכתובת:\nhttp://www.foo.com/change-password?user=alice&password=1234 כלומר, אם מנהל ייגש לכתובת הזו, הסיסמא של אליס תשתנה להיות 1234 (ורק הסיסמא תשתנה), והתשובה של השרת היא 204 (סטטוס 204 של http אומר שהפעולה בוצעה בהצלחה ואין שום תוכן טקסטואלי או html וכו׳ נוסף להחזיר - ולכן גוף התשובה ריק). זה כמובן יתרחש רק אם המשתמש שניגש\nלכתובת הוא אכן מנהל של המערכת (נבדק על ידי cookies). נתון כי השרת לא שומר את הסיסמאות באופן גלוי, אלא משתמש ב hash ו salt כפי שנלמד. המימוש הזה של האתר הזה מכיל חולשה. החולשה הזאת היא חולשה מסוג?","options":["Cross Site Request Forgery.","Cross Site Scripting.","הלוגריתם הדיסקרטי.","X-Frame-options."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":9},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":9},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.249,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q112","year":"2025","stem":"מה מהבאים מתאר בצורה הנכונה ביותר את ההבדל המרכזי בין הצפנה לחתימה דיגיטלית?","options":["הצפנה נועדה לשמור על סודיות המידע, בעוד שחתימה דיגיטלית נועדה לאמת את מקור ושלמות המידע.","הצפנה משתמשת תמיד במפתחות סימטריים, ואילו חתימה דיגיטלית תמיד משתמשת במפתחות א-סימטריים.","הצפנה מונעת זיופים של המסר, בעוד שחתימה דיגיטלית מונעת גישה לא מורשית למידע.","חתימה דיגיטלית היא תהליך הממיר טקסט קריא לטקסט מוצפן, בעוד שהצפנה מאמתת זהות שולח ההודעה."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":10},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":10},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.215,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q113","year":"2025","stem":"בהקשר של חתימה דיגיטלית לפי textbook RSA (כלומר ללא hash), אם ידוע שה private key הוא:\nn = 33 d = 7 ונתונה החתימה הדיגיטלית σ כאשר 30=σ. מהי ההודעה המקורית שחתמו עליה?","options":["6","5","7","4"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":1},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.497,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q114","year":"2025","stem":"כאשר לקוח בודק את שרשרת התעודות (Chain of trust) ב-TLS, מה הוא בודק?","options":["חתימות דיגיטליות תקינות על התעודות עד ל Root CA שהוא סומך עליו","מפתח סימטרי תואם","התאמה בין המפתח הציבורי למפתח הפרטי של הלקוח","זמן פקיעה זהה של כל התעודות בשרשרת"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":2},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.253,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q115","year":"2025","stem":"למה גורם דגל הHttpOnly בעוגיות?","options":["מונע גישה באמצעות JavaScript לעוגיה","מונע שליחה של העוגיה ל-DOM","מאפשר שמירת מפתחות הצפנה בצד הלקוח","מונע שליחה של העוגיה ב-HTTPS"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":3},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.164,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q116","year":"2025","stem":"נתון הפסאודו-קוד הבא:\n```\ndef receive_secure_message(ciphertext, k1, k2):\n    decrypted = decrypt(ciphertext, k1)\n\n    (message, tag) = separate_to_message_and_tag(decrypted)\n\n    if mac(message, k2) != tag:\n        raise Exception(\"Authentication failed!\")\n\n    return message\n```\nאיזו מהשיטות הבאות היא השיטה שהשתמשו בה?","options":["MAC-then-Encrypt","Encrypt-then-MAC","Encrypt-and-MAC","Salt-and-Pepper"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":4},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.35,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q117","year":"2025","stem":"כיצד מבוצעת אימות עסקה ברשת ביטקוין?","options":["על ידי הכורים המאמתים את העסקה ומוסיפים אותה לבלוק הבא","על ידי הרשויות הממשלתיות בלבד","על ידי המשתמש ששולח את העסקה","על ידי שרת מרכזי של ביטקוין"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":5},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.219,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q118","year":"2025","stem":"נתון דף אינטרנט שמוצג בגלישה לURL הבא:\n```\nhttp://foo.com/?name=VALUE\n```\nהדף מציג את הערך של הפרמטר name ישירות בתוך תגית HTML כך:\n```\n<div id=\"greeting\">Welcome, VALUE<\/div>\n```\nללא כל סינון או קידוד של התוכן שמגיע מה-URL.\nבנוסף, בדף יש טופס עם Anti-CSRF Token שמוצג בטופס כך:\n```\n<form method=\"POST\" action=\"/update_password\">\n<input type=\"hidden\" name=\"csrf_token\" value=\"random_token_value\">\n<input type=\"password\" name=\"new_password\">\n<input type=\"submit\" value=\"Submit\">\n<\/form>\n```\nכאשר במקום random_token_value יופיע token אקראי שהשרת בחר.\nאיזו מהטענות הבאות אינה נכונה?","options":["ה-CSRF Token לא יכול להיגנב כי הוא ב-POST בלבד ולא ב-URL","הדף פגיע ל-Reflected XSS מכיוון שהפרמטר name מוצג ללא סינון","תוקף יכול להזריק קוד JavaScript ב-name ולגנוב את ה-csrf_token מהטופס","גניבת ה-csrf_token מאפשרת לתוקף לבצע בקשות POST עם טוקן תקין שהשרת יקבל כתקין"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":6},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.22,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q119","year":"2025","stem":"אתר מסחר אלקטרוני גדול מגלה שהמפתח הפרטי של תעודת ה-SSL/TLS שלו נגנב. הוא פונה ל CA שהנפיק לו את התעודה, וה CA מבטל את התעודה באופן מיידי. למרות זאת, חוקרי אבטחה מדווחים כי דפדפנים של משתמשים רבים עדיין מקבלים את התעודה הגנובה כתקפה במשך שעות לאחר הביטול הרשמי, ומאפשרים לתוקפים להפעיל אתרי פישינג. מבין האפשרויות הבאות, מהי סיבה אפשרית לפער הזמנים בין הביטול הרשמי לחוסר האפקטיביות שלו בפועל אצל משתמשי קצה?","options":["כאשר דפדפנים נתקלים בבעיית תקשורת רגעית או עיכוב בקבלת תשובה משרתי הביטול המוסמכים מטעם ה-CA, הם בוחרים להתייחס לתעודה כתקפה כדי לא לפגוע בחוויית המשתמש (מדיניות Fail-Soft)","שרתי אתר המסחר השתמשו ב-OCSP Stapling. התוקפים משתמשים במפתח הפרטי שגנבו כדי לחתום על אישור ה OCSP Stapling","יומני ה Certificate Transparency טרם התעדכנו באופן גלובלי בסטטוס הביטול. דפדפנים מסוימים המסתמכים על יומנים אלה לקבלת מידע נוסף על תעודות, מפספסים את עובדת הביטול","העדכון של כל שרתי השורש (Root Servers) בעולם לוקח מספר ימים"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":7},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.258,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q120","year":"2025","stem":"נתון הפרוטוקול הבא להעברה של מפתח משותף K מאליס לבוב:\n1. אליס מגרילה באקראי מפתח ארוך K.\n2. אליס מגרילה מחרוזת K<sub>A<\/sub> חד פעמית אקראית באורך |K|.\n3. אליס מחשבת את K<sub>1<\/sub> באופן הבא: K<sub>1<\/sub> = K xor K<sub>A<\/sub>, ואליס שולחת את K<sub>1<\/sub> לבוב.\n4. בוב מגריל מחרוזת K<sub>B<\/sub> חד פעמית אקראית באורך |K<sub>1<\/sub>|.\n5. בוב מחשב את K<sub>2<\/sub> באופן הבא: K<sub>2<\/sub> = K<sub>1<\/sub> xor K<sub>B<\/sub>, ושולח לאליס את K<sub>2<\/sub>.\n6. אליס מחשבת את K<sub>3<\/sub> באופן הבא: K<sub>3<\/sub> = K<sub>2<\/sub> xor K<sub>A<\/sub>, ואליס שולחת את K<sub>3<\/sub> לבוב.\n7. בוב מחשב: K<sub>3<\/sub> xor K<sub>B<\/sub>, ומקבל את K. איזו מהטענות הבאות נכונה?","options":["הפרוטוקול אינו מוגן כנגד אויב מאזין","הפרוטוקול מוגן כנגד אויב מאזין אך אינו מוגן כנגד אויב MitM","הפרוטוקול מוגן כנגד אויב מאזין וגם מוגן כנגד אויב MitM","הפרוטוקול מוגן כנגד אויב MitM, בתנאי שהאויב לא יכול לעכב הודעות"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":8},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.173,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q121","year":"2025","stem":"איזו מהטענות הבאות נכונה?","options":["צופן בלוקים פחות מאובטח מצופן One time pad (בגלל תכונת ה perfect secrecy)","ב PKI, שרת אינטרנט X שקיבל תעודה חתומה מ CA על ה public key של שרת האינטרנט, חייב ש ה\nCA שנתן לו (ל X) את התעודה יהיה ב root store של הלקוחות","ב TLS, שרת אינטרנט חייב לייצר בעצמו תעודה עבור כל חיבור TLS","הקמת חיבור TLS מחייבת שימוש בתעודה רק במקרה והחיבור מוקם בין שני שרתים"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":9},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.312,"exam_count":1,"in_sample_exam":false,"variant_group":"V03"},{"id":"Q122","year":"2025","stem":"איזה מהאלגוריתמים הבאים הוא אלגוריתם השייך לקריפטוגרפיה א-סימטרית?","options":["RSA","MAC","HASH","AES"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":10},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.211,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q123","year":"2025","stem":"איזו תכונה חתימות דיגיטליות מאפשרות ש Message Authentication Codes לא מאפשרות?","options":["אי-יכולת הכחשה","סודיות","אמינות המידע","אותנטיות"],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.317,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q124","year":"2025","stem":"ב TLS, ה pre master secret מוצפן לפני העברתו אל השרת על ידי:","options":["המפתח הפומבי של השרת","המפתח הפרטי של השרת","המפתח הפומבי של הלקוח","המפתח הפרטי של הלקוח"],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.387,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q125","year":"2025","stem":"איזה מהתיאורים הבאים מתאר את התקפת ARP poisoning?","options":["תוקף שולח הודעות ARP שקריות בהן הוא משקר לגבי מיפוי בין כתובת MAC ו IP, כדי שהתעבורה של הקורבן תגיע אליו (אל התוקף).","תוקף שולח הודעות ARP רבות אל ה switch כדי להציף את הטבלה של ה switch במיפויים שקריים.","תוקף מאזין לתעבורת ARP ומזהה הודעות ARP פגיעות, ומחלץ מהן את כתובת ה IP של הקורבנות.","תוקף שולח הודעות ARP אל שרת ה DNS המקומי של הרשת, כדי ששרת ה DNS יעבוד כמו hub במקום כמו switch."],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.344,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q126","year":"2025","stem":"איזה מהתרחישים הבאים ייחסמו על ידי מנגנון ה Same Origin Policy?","options":["סקריפט שהגיע מ foo.com (זה ה origin של הסקריפט) מנסה לקרוא תוכן של תשובת http שמגיעה מ bar.com","עמוד שהגיע מ foo.com מנסה לטעון תמונה מהדומיין bar.com","סקריפט זדוני שהוחדר לעמוד שהגיע מ foo.com ושולח את פרטי הcookie של הקורבן אל bar.com","משתמש גלש לאתר foo.com ובאתר זה ישנו סקריפט ששולח טופס אל הדומיין bar.com שאליו המשתמש מחובר (ולכן הדפדפן צירף את ה cookie של המשתמש לבקשה)"],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.249,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q127","year":"2025","stem":"אליס פיתחה קליינט ביטקוין ״רזה״, כלומר, הקליינט שפיתחה שומר רק את רשימת העסקאות שנכללות בבלוקצ׳יין אבל עדיין לא בוזבזו ורק את הבלוק האחרון בבלוקצ׳יין. איזו מבין הטענות הבאות נכונה?","options":["הקליינט הזה לא יכול להתמודד בעצמו עם forkים מסויימים.","הקליינט הזה שומר יותר מידע ממה ש miner שומר.","הקליינט הזה לא יכול לוודא את ה proof of work של בלוק חדש שמוצג בפניו.","הקליינט הזה לא יכול להיות בשימוש, כי אינו קליינט רשמי שאושר על ידי ביטקוין."],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.242,"exam_count":1,"in_sample_exam":false,"variant_group":null},{"id":"Q128","year":"2025","stem":"אליס ובוב מעוניינים לדבר אחד עם השניה בצורה מאובטחת, כך שרק הם ידעו מה הם שולחים ביניהם. אליס ובוב יצרו לעצמם (כל אחד בנפרד), מפתח פומבי ומפתח פרטי. אליס ובוב אינם יודעים את המפתחות אחד של השני, גם לא את הפומביים. הם משתמשים בשירות מסרים, ולשירות זה יש שרת שיודע את המפתחות הפומביים האמיתיים של כל הלקוחות, כולל של אליס ובוב. השרת הינו תקין ואינו בשליטת תוקף.\nאליס פונה אל השרת ומבקשת את המפתח הפומבי של בוב. השרת שולח לה בחזרה: את המפתח הפומבי של בוב, את התאריך והשעה הנוכחיים, וחתימה דיגיטלית על הערכים הללו (מפתח פומבי ותאריך ושעה) שנחתמה על ידי המפתח הפרטי של השרת (כל הלקוחות יודעים את המפתח הפומבי האמיתי של השרת). האם הפרוטוקול הנ״ל בטוח?","options":["לא, תוקף MitM יכול לגרום לאליס לחשוב שהמפתח של התוקף זה המפתח של בוב.","לא, תוקף off-path יכול לגרום לשרת לחשוב שהמפתח של בוב זה המפתח של אליס.","לא, תוקף eavesdropper יכול לגרום לשרת לחשוב שהמפתח של בוב זה המפתח של אליס.","כן, שום תוקף לא יכול לנצל לרעה את הפרוטוקול בזכות השימוש המתואר בחתימה דיגיטלית."],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.21,"e
