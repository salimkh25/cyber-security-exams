<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספריית סרטונים · מבוא לאבטחת סייבר</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#16202e; --muted:#5a6475; --line:#dde2ea;
  --accent:#1d4f91; --accent-soft:#e7eef9; --key:#1f6b4a; --key-soft:#e6f2ec; --star:#9a5200; --star-soft:#fcf0dc;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151d; --card:#18202b; --ink:#e6ebf2; --muted:#9aa5b5; --line:#2a3443;
  --accent:#8db4ef; --accent-soft:#1d2b40; --key:#7fd0a8; --key-soft:#183026; --star:#f0b35e; --star-soft:#3a2a12;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#10151d; --card:#18202b; --ink:#e6ebf2; --muted:#9aa5b5; --line:#2a3443;
  --accent:#8db4ef; --accent-soft:#1d2b40; --key:#7fd0a8; --key-soft:#183026; --star:#f0b35e; --star-soft:#3a2a12;
  --shadow:none;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew",Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
h1{font-size:20px;margin:0;flex:1;min-width:220px}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.progress{font-size:13px;color:var(--muted);white-space:nowrap}
.progress b{color:var(--key)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px;width:140px}
.bar i{display:block;height:100%;background:var(--key);width:0;transition:width .2s}
button.theme{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px;align-items:center}
input[type=search]{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
label.chk{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
main{padding:18px 0 40px}
section{margin-bottom:28px}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--card);font-size:13px}
h2 .c{font-size:12px;font-weight:400;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card.done{opacity:.55}
.thumb{position:relative;display:block;aspect-ratio:16/9;background:var(--accent-soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .len{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;padding:1px 6px;border-radius:4px;direction:ltr}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .15s;background:rgba(0,0,0,.25)}
.thumb:hover .play,.thumb:focus .play{opacity:1}
.play span{width:52px;height:36px;border-radius:9px;background:#e62117;display:grid;place-items:center}
.play span:after{content:"";border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent #fff;margin-left:3px}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.title{font-weight:600;font-size:14px;line-height:1.4;color:var(--ink);text-decoration:none;unicode-bidi:plaintext;text-align:start}
.title:hover{color:var(--accent)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.he{background:var(--key-soft);color:var(--key)}
.tag.st{background:var(--star-soft);color:var(--star)}
.note{font-size:13px;color:var(--ink);margin:0;flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.foot a{font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 30px}
@media (max-width:520px){header{position:static}h1{font-size:17px}.bar{width:100px}.grid{grid-template-columns:1fr}}
</style>
</head>

tory", "channel": "LiveOverflow", "note": "מדיניות Same Origin: מה מותר לסקריפט לקרוא ומה לא.", "start": 0, "he": false}, {"ch": 9, "id": "A7nih6SANYs", "len": "11:35", "title": "ARP Poisoning | Man-in-the-Middle Attack", "channel": "CertBros", "note": "הרעלת ARP ואיך היא מובילה לאדם-בתווך ברשת מקומית.", "start": 0, "he": false}, {"ch": 9, "id": "7MT1F0O3_Yw", "len": "11:04", "title": "DNS Cache Poisoning - Computerphile", "channel": "Computerphile", "note": "הרעלת מטמון DNS: ניחוש TXID ותשובות מזויפות.", "start": 1, "he": false}, {"ch": 9, "id": "B-v_wJIJUI4", "len": "5:05", "title": "Hacker History: The Great DNS Vulnerability of 2008 by Dan Kaminsky", "channel": "Duo Security", "note": "מתקפת קמינסקי מ-2008 ולמה הוסיפו פורט מקור אקראי.", "start": 0, "he": false}, {"ch": 9, "id": "tClcCMrXzek", "len": "7:28", "title": "SYN Flood Attack Explained", "channel": "Hussein Nasser", "note": "SYN Flood: איך חצי-חיבורים ממלאים את השרת, ו-SYN cookies.", "start": 0, "he": false}, {"ch": 9, "id": "bDAY-oUP0DQ", "len": "9:52", "title": "Denial of Service Attacks Explained", "channel": "IBM Technology", "note": "סוגי DoS ו-DDoS בסקירה רחבה.", "start": 0, "he": false}, {"ch": 9, "id": "rL4-vbsN35w", "len": "14:04", "title": "Stateful vs Stateless Firewalls - You NEED to know the difference", "channel": "LearnCantrill", "note": "חומת אש עם מצב (stateful) מול חומת אש בלי מצב.", "start": 0, "he": false}];
const CH={"1": "מבוא, מודלי תוקף ותקשורת ברשת", "2": "הצפנה סימטרית וצפנים קלאסיים", "3": "פונקציות Hash, סיסמאות ו-MAC", "4": "קריפטוגרפיה אסימטרית: דיפי-הלמן, RSA וחתימות", "5": "PKI ותעודות דיגיטליות", "6": "תקשורת מאובטחת: TLS ו-HTTPS", "7": "ביטקוין ובלוקצ׳יין", "8": "אבטחת Web", "9": "אבטחת רשת: ARP, DNS, DoS וחומות אש"};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let watched=new Set(store.get('cyber-vids-watched',[]));
const st={q:'',lang:'all',ch:0,star:false,hide:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// theme
(function(){const t=store.get('cyber-vids-theme',null); if(t) document.documentElement.dataset.theme=t;})();
$('#theme').onclick=()=>{const r=document.documentElement;
  const dark=r.dataset.theme? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark'; store.set('cyber-vids-theme',r.dataset.theme);};

// chips
const chips=$('#chips');
chips.innerHTML='<button data-c="0" class="on">כל הפרקים</button>'+Object.entries(CH).map(([n,t])=>`<button data-c="${n}">${n}. ${esc(t)}</button>`).join('');
chips.onclick=e=>{const b=e.target.closest('button'); if(!b) return; st.ch=+b.dataset.c;
  chips.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render();};
$('#lang').onclick=e=>{const b=e.target.closest('button'); if(!b) return; st.lang=b.dataset.v;
  $('#lang').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render();};
$('#q').oninput=e=>{st.q=e.target.value.trim().toLowerCase(); render();};
$('#starOnly').onchange=e=>{st.star=e.target.checked; render();};
$('#hideDone').onchange=e=>{st.hide=e.target.checked; render();};

function card(v){
  const done=watched.has(v.id);
  return `<article class="card${done?' done':''}">
   <a class="thumb" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" aria-label="צפייה ביוטיוב">
    <img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" onerror="this.style.display='none'">
    <span class="len">${esc(v.len)}</span><span class="play"><span></span></span></a>
   <div class="body">
    <a class="title" dir="auto" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${esc(v.title)}</a>
    <div class="meta"><span dir="auto">${esc(v.channel)}</span>
     <span class="tag${v.he?' he':''}">${v.he?'עברית':'אנגלית'}</span>${v.start?'<span class="tag st">★ להתחיל כאן</span>':''}</div>
    <p class="note">${esc(v.note)}</p>
    <div class="foot"><label class="chk"><input type="checkbox" data-id="${v.id}"${done?' checked':''}> נצפה</label>
     <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">ליוטיוב ↗</a></div>
   </div></article>`;
}
function render(){
  const list=V.filter(v=>(!st.ch||v.ch===st.ch)&&(st.lang==='all'||(st.lang==='he')===v.he)&&(!st.star||v.start)
    &&(!st.hide||!watched.has(v.id))&&(!st.q||(v.title+' '+v.channel+' '+v.note+' '+CH[v.ch]).toLowerCase().includes(st.q)));
  const by={}; list.forEach(v=>(by[v.ch]=by[v.ch]||[]).push(v));
  const keys=Object.keys(by).sort((a,b)=>a-b);
  $('#main').innerHTML=keys.length? keys.map(k=>`<section><h2><span class="n">${k}</span>${esc(CH[k])}<span class="c">${by[k].length} סרטונים</span></h2>
    <div class="grid">${by[k].sort((a,b)=>b.start-a.start||a.he-b.he).map(card).join('')}</div></section>`).join('')
    : '<p class="empty">לא נמצאו סרטונים. נסו חיפוש אחר.</p>';
  const n=V.filter(v=>watched.has(v.id)).length;
  $('#prog').innerHTML=`נצפו <b>${n}</b> מתוך ${V.length}`; $('#pbar').style.width=(100*n/V.length)+'%';
}
$('#main').onchange=e=>{const id=e.target.dataset.id; if(!id) return;
  e.target.checked?watched.add(id):watched.delete(id); store.set('cyber-vids-watched',[...watched]); render();};
render();
</script>
